<!DOCTYPE html>
<html lang="en"></html>
<head>
  <meta charset="UTF-8">
  <title>Laskuri</title>
</head>
<body>
  <h2>Ohtulaskuri</h2>
  <div>nappia painettu {{ value }} kertaa</div>
  <form action="/increment" method="POST">
    <button type="submit">
      Paina
    </button>
  </form>
  <form action="/reset" method="POST">
    <button type="submit">
      Nollaa
    </button>
  </form>
  <label for="value">Aseta arvo:</label>
  <form action="/set_value" method="POST">
    <input type="text" id="value" name="value" min="0" style="">
    <button type="submit">
      Aseta
    </button>
</body>
</html>
